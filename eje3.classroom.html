<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tareas</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .task-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            width: 300px;
        }

        h2 {
            margin-top: 0;
            color: #333;
        }

        .task-item {
            display: flex;
            align-items: center;
            margin: 15px 0;
            cursor: pointer;
            font-size: 1.1rem;
        }

       
        .task-checkbox {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

     
        .task-text {
            color: #2c3e50;
            transition: all 0.3s ease;
        }

       
        .task-checkbox:checked + .task-text {
            text-decoration: line-through;
            color: #95a5a6; 
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="task-container">
        <h2>Mis cosas</h2>
        
        <label class="task-item">
            <input type="checkbox" class="task-checkbox">
            <span class="task-text">comprar pan</span>
        </label>

        <label class="task-item">
            <input type="checkbox" class="task-checkbox">
            <span class="task-text">llegar a casa</span>
        </label>

        <label class="task-item">
            <input type="checkbox" class="task-checkbox">
            <span class="task-text">jugar Minecraft</span>
        </label>
    </div>

</body>
</html>
