<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil de Usuario</title>
    <link rel="stylesheet" href="Perfil.css">
<body>

    <div class="profile-container">
        <h2>Perfil</h2>
        
        <form action="#" method="POST">

            <div class="form-group">
                <label for="fullname">Nombre Completo</label>
                <input type="text" id="fullname" name="fullname" placeholder="Nombre" required>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" placeholder="Nombre@gmail.com" required>
            </div>

            <div class="form-group">
                <label for="job">Ocupación o Profesión</label>
                <input type="text" id="job" name="job" placeholder="Ej. Computación/Laboratorio">
            </div>
            <nav class="navbar2">
                <ul class="nav-links">
                    <li><a href="Home.html  ">Home</a></li>
                </ul>
            </nav>
           

        </form>
    </div>

</body>
</html>
