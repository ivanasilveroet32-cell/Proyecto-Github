<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerta de Servicio de Internet</title>
    <!-- Vinculación con el archivo CSS externo -->
    <link rel="stylesheet" href="24.css">
</head>
<body>

    <div class="alerta-container">
        <!-- Encabezado de Alerta -->
        <div class="alerta-header">
            <span>⚠️ ALERTA DE MAL SERVICIO</span>
        </div>
        
        <!-- Contenido de la Queja -->
        <div class="alerta-body">
            <h3 class="alerta-empresa">Proveedor: FibraInestable S.A.</h3>
            
            <div class="alerta-comparacion">
                <!-- Lo que prometen -->
                <div class="alerta-fila fila-promesa">
                    <div class="alerta-texto">
                        <strong>Lo que te prometen:</strong> 
                        <p>1000 Megas simétricos de fibra óptica y soporte Técnico 24/7.</p>
                    </div>
                    <span class="tag tag-promesa">Expectativa</span>
                </div>
                
                <!-- La realidad -->
                <div class="alerta-fila fila-realidad">
                    <div class="alerta-texto">
                        <strong>Servicio real:</strong> 
                        <p>Microcortes continuos, 40 Megas reales y atención automática por bot.</p>
                    </div>
                    <span class="tag tag-realidad">Realidad</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
